<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike 4 U — Daily Board</title>
<style>
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0b0c;color:#f2f3f4}
header{position:sticky;top:0;background:#131415;border-bottom:1px solid #26292c;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
h1{font-size:16px;margin:0}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid #26292c;background:none;color:#f2f3f4;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px}
.item{display:flex;gap:10px;align-items:flex-start;background:#131415;border:1px solid #26292c;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item.carried{border-color:#D0112Baa;background:#1a0d0f}
.item.done{opacity:.45}
.cb{width:22px;height:22px;accent-color:#D0112B;margin-top:1px;flex:none}
.t{font-size:14px;line-height:1.35}
.meta{font-size:11px;color:#8a8f94;margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:700;color:#f2f3f4;border:1px solid #3a3f43;margin-right:6px}
.warn{color:#D0112B;font-weight:600;font-size:11px}
.dd{background:none;border:1px solid transparent;color:#8a8f94;border-radius:6px;font-size:11px;padding:1px 3px;font-family:inherit}
.dd:hover{border-color:#26292c}
.rem{font-size:10px;font-weight:700;color:#8a8f94;margin-right:4px}
.add{position:sticky;bottom:0;background:#131415;border-top:1px solid #26292c;padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap}
.add input[type=text]{flex:1;min-width:160px;background:#0a0b0c;border:1px solid #26292c;color:#f2f3f4;border-radius:8px;padding:9px 10px;font-size:14px}
.add select,.add input[type=date],.add input[type=time]{background:#0a0b0c;border:1px solid #26292c;color:#f2f3f4;border-radius:8px;padding:8px;font-size:13px}
.add button{background:#D0112B;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.section{font-size:11px;font-weight:700;letter-spacing:.05em;color:#8a8f94;margin:14px 2px 8px;text-transform:uppercase}
.empty{color:#8a8f94;font-size:13px;padding:20px;text-align:center}
.hint{font-size:10px;color:#8a8f94;width:100%;margin:-2px 0 0}
</style></head><body>
<header><h1>Bike 4 U — Daily Board</h1><span id="date" class="meta"></span>
<div class="tabs"><input type="date" id="df" class="tab" title="Show only one day (leave empty for the normal view)" style="color-scheme:dark"><span style="font-size:11px;color:#8a8f94;align-self:center">I am</span><select id="who" class="tab"></select></div></header>
<main><div id="list"><p class="empty">Loading…</p></div></main>
<div class="add"><input type="text" id="nt" placeholder="Add a task…"><select id="na"></select><input type="date" id="nd"><input type="time" id="nh" title="Set a time to make it a reminder"><button id="nb">Add</button><p class="hint">Give it a time and it becomes a reminder that pops up in the app at that time. End with !, !! or !!! to set priority — !!! goes to the top.</p></div>
<script>
// The token used to live ONLY in ?t=. Open the board from a bookmark without
// it — or let the phone drop the query string — and every call 403s. The page
// said nothing, so it read as "can't add reminders" (Max, 2026-09-28).
// Remember it once seen, and fall back to the remembered one.
const TOKEN=(function(){
  const fromUrl=new URLSearchParams(location.search).get('t');
  try{
    if(fromUrl){localStorage.setItem('b4u_board_token',fromUrl);return fromUrl;}
    return localStorage.getItem('b4u_board_token')||null;
  }catch(e){return fromUrl;}
})();
const API='https://jpzhifjccuxcetdodeue.supabase.co/functions/v1/todo-web';
let DATA=null;
const colors={};const PAL=["#26292c","#26292c","#26292c","#26292c","#26292c","#26292c"];
function whoName(){const w=document.getElementById('who');return (w.selectedOptions[0]&&w.selectedOptions[0].text)||'Dom'}
function dateFilter(){return document.getElementById('df').value||''}
function say(msg,bad){let el=document.getElementById('msg');
  if(!el){el=document.createElement('div');el.id='msg';
    el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;padding:10px 14px;border-radius:10px;font:600 13px system-ui;z-index:99;max-width:90vw';
    document.body.appendChild(el);}
  el.textContent=msg;el.style.background=bad?'#D0112B':'#111';el.style.color='#fff';
  clearTimeout(say._t);say._t=setTimeout(()=>{el.textContent='';el.style.background='transparent'},4000);}

// ⚠️ Errors used to be swallowed whole: a 403 or a dropped connection cleared
// the box and showed nothing at all, which is indistinguishable from "adding
// is broken". Every failure now says so.
async function post(body){
  if(!TOKEN){say('This board link is missing its token — open it from the original link Max sent.',1);return{error:'no token'};}
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,who:whoName(),...body})});}
  catch(e){say('No connection — nothing was saved.',1);return{error:String(e)};}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||j.error){say(r.status===403?'This board link is no longer valid — ask Max for a new one.':('Could not save: '+(j.error||r.status)),1);return j;}
  return j;
}
function chip(aid){const a=(DATA.assignees||[]).find(x=>x.id===aid);if(!a)return '';return '<span class="chip" style="background:'+(colors[a.id]||'#555')+'">'+a.name+'</span>'}
function esc(x){return String(x||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function yest(){const d=new Date(Date.now()-86400000);return d.toISOString().slice(0,10)}
function dateBox(r){return '<input class="dd" type="date" value="'+r.due_date+'" onchange="setDate(\''+r.id+'\',this.value,\''+r.kind+'\')">'}
function row(r){
  const carried=!r.done&&r.first_due&&r.first_due<DATA.today;
  const pr=Number(r.priority)||0;
  const title=(pr>0?'<span style="color:#D0112B;font-weight:800;margin-right:4px">'+'!'.repeat(pr)+'</span>':'')+(r.kind==='rem'?'<span class="rem">🔔</span>':'')+(r.driver_name?'<b>'+esc(r.driver_name.split(' ')[0])+'</b>: ':'')+esc(r.title)+(r.due_time?' ('+String(r.due_time).slice(0,5)+')':'');
  const meta=(carried?'<span class="warn">⚠ not completed '+(r.first_due===yest()?'yesterday':'since '+r.first_due)+' — prioritise today</span> · ':'')
    +(r.category?esc(r.category)+' · ':'')
    +(r.done?'✓ done '+new Date(r.done_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})+' by '+esc(r.done_by||'?'):'due '+dateBox(r));
  return '<div class="item '+(carried?'carried ':'')+(r.done?'done':'')+'"><input class="cb" type="checkbox" '+(r.done?'checked':'')+' onchange="tick(\''+r.id+'\',this.checked,\''+r.kind+'\')"><div><div class="t" style="cursor:pointer" title="Tap to edit" onclick="editItem(\''+r.id+'\',\''+r.kind+'\')">'+chip(r.assignee_id)+title+'</div><div class="meta">'+meta+'</div></div></div>';
}
function render(){
  const el=document.getElementById('list');if(!DATA){el.innerHTML='<p class="empty">Loading…</p>';return}
  document.getElementById('date').textContent=new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'2-digit',month:'long'});
  (DATA.assignees||[]).forEach((a,i)=>colors[a.id]=PAL[i%PAL.length]);
  const na=document.getElementById('na');
  if(na.options.length!==(DATA.assignees||[]).length+1){na.innerHTML='<option value="">Anyone</option>'+(DATA.assignees||[]).map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')}
  const w=document.getElementById('who');
  if(w.options.length!==(DATA.assignees||[]).length){
    const saved=localStorage.getItem('board_who')||'';
    // fixed order: Dom, Max, Diogo, then anyone new (Max, 2026-09-18)
    const ORDER=['dom','max','diogo'];
    const rank=n=>{const i=ORDER.indexOf(n.toLowerCase());return i===-1?99:i};
    const ppl=[...(DATA.assignees||[])].sort((a,b)=>rank(a.name)-rank(b.name)||a.name.localeCompare(b.name));
    const sel=saved||((ppl.find(a=>a.name.toLowerCase()==='dom')||ppl[0]||{}).id||'');
    w.innerHTML=ppl.map(a=>'<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>').join('');
    if(!saved&&w.options.length)localStorage.setItem('board_who',w.value);
  }
  const ME=w.value;
  const all=[
    ...(DATA.todos||[]).map(t=>({...t,kind:'todo',done:!!t.completed,done_at:t.completed_at,done_by:t.completed_by})),
    ...(DATA.reminders||[]).map(r=>({...r,kind:'rem',done:!!r.done_at,done_by:r.completed_by})),
  ].sort((a,b)=>((Number(b.priority)||0)-(Number(a.priority)||0))||String(a.due_date).localeCompare(String(b.due_date))||String(a.created_at||'').localeCompare(String(b.created_at||''))).filter(r=>!r.assignee_id||r.assignee_id===ME); // !!! band first; newest at the bottom of its band
  const DF=dateFilter();
  if(DF){
    const dayRows=all.filter(r=>r.due_date===DF);
    el.innerHTML='<div class="section">Due '+DF+'</div>'+(dayRows.length?dayRows.map(row).join(''):'<p class="empty">Nothing due on '+DF+'</p>');
    return;
  }
  const carried=all.filter(r=>!r.done&&r.first_due&&r.first_due<DATA.today);
  const today=all.filter(r=>!r.done&&!(r.first_due&&r.first_due<DATA.today));
  const done=all.filter(r=>r.done);
  let html='';
  if(carried.length)html+='<div class="section">⚠ Carried over</div>'+carried.map(row).join('');
  html+='<div class="section">Today</div>'+(today.length?today.map(row).join(''):'<p class="empty">Nothing for today — add below</p>');
  if(done.length)html+='<div class="section">Done today</div>'+done.map(row).join('');
  el.innerHTML=html;
}
async function editItem(id,kind){
  const src=kind==='rem'?(DATA.reminders||[]):(DATA.todos||[]);
  const cur=src.find(x=>x.id===id);if(!cur)return;
  const nt=prompt('Edit the wording:',cur.title);
  if(nt===null||!nt.trim()||nt.trim()===cur.title)return;
  await post({action:'set_title',id,kind,title:nt.trim()});load();
}
async function tick(id,done,kind){await post({action:kind==='todo'?'done_todo':'done_rem',id,done});load()}
async function setDate(id,due,kind){if(!due)return;await post({action:'set_date',id,due,kind});load()}
async function load(){try{DATA=await post({action:'data',until:dateFilter()||null});render()}catch(e){document.getElementById('list').innerHTML='<p class="empty">Connection problem — retrying…</p>'}}
document.getElementById('nb').onclick=async()=>{const t=document.getElementById('nt').value.trim();if(!t)return;await post({action:'add',title:t,assignee_id:document.getElementById('na').value||null,due:document.getElementById('nd').value||null,due_time:document.getElementById('nh').value||null});document.getElementById('nt').value='';document.getElementById('nh').value='';say(document.getElementById('nh').value?'Reminder added':'Added');load()};
document.getElementById('df').onchange=()=>load();
document.getElementById('who').onchange=()=>{localStorage.setItem('board_who',document.getElementById('who').value);render()};
document.getElementById('nd').value=new Date(Date.now()+72e5).toISOString().slice(0,10);
load();setInterval(load,45000);
</script></body></html>
